<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedTrace</title>
  <meta name="description" content="Evidence-based custody and integrity checks for medical supply deliveries.">

<body>
  <header class="topbar" id="topbar" hidden>
